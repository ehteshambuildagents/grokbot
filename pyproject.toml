[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "localcrew"
version = "0.3.0"
description = "Self-hosted AI teammate platform: durable agent tasks, browser/terminal tools, MCP servers, approvals."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
authors = [{ name = "ehteshambuildagents" }]
keywords = ["ai-agents", "llm", "mcp", "ollama", "self-hosted", "fastapi", "playwright"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Runtime pins mirror services/api/requirements.in; the full lock is services/api/requirements.lock.
dependencies = [
  "fastapi==0.143.3",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.5",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "httpx==0.28.1",
  "playwright==1.64.0",
  "argon2-cffi==25.1.0",
  "cryptography==50.0.2",
  "croniter==6.2.4",
  "tzdata==2026.5",
  "python-multipart==0.0.32",
  "pypdf==6.21.1",
  "mcp==2.3.0",
  "jsonschema==4.26.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[project.urls]
Repository = "https://github.com/ehteshambuildagents/grokbot"
Changelog = "https://github.com/ehteshambuildagents/grokbot/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "services/api" }
packages = ["localcrew"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["realmodel: uses a real local Ollama model (slow)"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 170
target-version = "py313"
extend-exclude = ["services/api/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP", "I", "BLE"]
ignore = [
  "S101",          # asserts are used in tests
  "S603", "S607",  # subprocess with argv lists is the intended design (terminal tool, ops scripts)
  "B008",          # FastAPI Depends() defaults
  "UP007",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "BLE"]
"infra/scripts/*" = ["S"]
